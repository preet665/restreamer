<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Streamer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem;
            text-align: center;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        main {
            flex: 1;
            width: min(960px, 100%);
            margin: 2rem auto;
            padding: 0 1.5rem 2rem;
        }

        form {
            display: grid;
            gap: 1rem;
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.35);
        }

        label {
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        input[type="url"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: inherit;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35);
        }

        button {
            justify-self: flex-start;
            padding: 0.8rem 1.6rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.25);
        }

        select {
            appearance: none;
            width: fit-content;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            border: 1px solid #334155;
            background: #0f172a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><path fill="%23cbd5f5" d="M4.7 6.3a1 1 0 0 1 1.4 0L9 9.2l2.9-2.9a1 1 0 0 1 1.4 1.4l-3.6 3.6a1 1 0 0 1-1.4 0L4.7 7.7a1 1 0 0 1 0-1.4z"/></svg>') no-repeat right 0.75rem center / 1rem;
            color: inherit;
        }

        select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }

        .status {
            min-height: 1.25rem;
            font-size: 0.95rem;
            color: #fbbf24;
        }

        .status.error {
            color: #f87171;
        }

        video {
            margin-top: 2rem;
            width: 100%;
            height: auto;
            max-height: 60vh;
            border-radius: 0.75rem;
            background: #000;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
        }

        @media (max-width: 640px) {
            form {
                padding: 1.25rem;
            }

            .controls {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>YouTube Streamer</h1>
        <p>Paste a YouTube URL, choose the quality, and start streaming directly.</p>
    </header>
    <main>
        <form id="stream-form">
            <div>
                <label for="youtube-url">YouTube URL</label>
                <input id="youtube-url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
            </div>
            <div class="controls">
                <select id="quality-select" disabled>
                    <option>Loading…</option>
                </select>
                <button type="submit">Get Stream</button>
            </div>
            <div id="status" class="status"></div>
        </form>
        <video id="player" controls poster="https://dummyimage.com/960x540/0f172a/475569&text=Paste+a+YouTube+URL+to+start">
            <source id="player-source" src="" type="application/x-mpegURL">
            Your browser does not support HTML5 video playback.
        </video>
    </main>
    <script>
        const form = document.getElementById('stream-form');
        const urlInput = document.getElementById('youtube-url');
        const qualitySelect = document.getElementById('quality-select');
        const statusBox = document.getElementById('status');
        const player = document.getElementById('player');
        const playerSource = document.getElementById('player-source');
        const defaultPoster = player.getAttribute('poster');

        let lastUrl = '';
        let isFetching = false;
        let currentQuality = 'best';

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (isFetching) {
                return;
            }

            const url = urlInput.value.trim();
            if (!url) {
                showStatus('Please enter a YouTube URL.', true);
                return;
            }

            isFetching = true;
            showStatus('Fetching video metadata…');
            disableQualitySelect();

            try {
                const data = await fetchStreamInfo(url);
                if (data.error) {
                    throw new Error(data.error);
                }

                lastUrl = url;
                const sortedLabels = sortQualityLabels(data.qualities || {});
                const defaultQuality = data.default_quality || sortedLabels[0] || 'best';

                populateQualities(sortedLabels, defaultQuality);
                player.poster = data.thumbnail || defaultPoster;

                await updatePlayerSource(url, defaultQuality);
                currentQuality = defaultQuality;

                const title = data.title ? `"${data.title}"` : 'video';
                showStatus(`Playing ${title} at ${currentQuality}`);
            } catch (error) {
                showStatus(error.message || 'Unable to load stream.', true);
                resetPlayer();
            } finally {
                isFetching = false;
            }
        });

        qualitySelect.addEventListener('change', async (event) => {
            const selected = event.target.value;
            if (!lastUrl || !selected || selected === currentQuality) {
                return;
            }

            try {
                showStatus('Switching quality…');
                await updatePlayerSource(lastUrl, selected);
                currentQuality = selected;
                showStatus(`Playing quality: ${selected}`);
            } catch (error) {
                showStatus(error.message || 'Unable to switch stream quality.', true);
                qualitySelect.value = currentQuality;
            }
        });

        function disableQualitySelect() {
            qualitySelect.disabled = true;
            qualitySelect.innerHTML = '<option>Loading…</option>';
        }

        async function fetchStreamInfo(url) {
            const response = await fetch(`/streams/info?${new URLSearchParams({ url }).toString()}`);
            if (!response.ok) {
                throw new Error('Failed to fetch stream metadata.');
            }
            return response.json();
        }

        async function fetchStreamUrl(url, quality) {
            const params = new URLSearchParams({ url, quality });
            const response = await fetch(`/streams/stream-url?${params.toString()}`);
            if (!response.ok) {
                throw new Error('Failed to retrieve stream URL.');
            }
            return response.json();
        }

        async function updatePlayerSource(url, quality) {
            const data = await fetchStreamUrl(url, quality);
            if (data.error || !data.stream_url) {
                throw new Error(data.error || 'Stream URL not found.');
            }

            await applyStream(data.stream_url, data.ext);
        }

        async function applyStream(streamUrl, ext) {
            playerSource.src = streamUrl;
            playerSource.type = guessMimeType(ext);
            player.load();
            await player.play().catch(() => player.pause());
        }

        function populateQualities(labels, selected) {
            if (!labels.length) {
                qualitySelect.disabled = true;
                qualitySelect.innerHTML = '<option>No qualities available</option>';
                return;
            }

            qualitySelect.disabled = false;
            qualitySelect.innerHTML = labels
                .map((label) => `<option value="${label}">${label}</option>`)
                .join('');
            qualitySelect.value = selected;
        }

        function sortQualityLabels(options) {
            const labels = Object.keys(options || {});
            if (!labels.includes('best')) {
                labels.push('best');
            }

            const uniqueLabels = Array.from(new Set(labels));
            return uniqueLabels.sort((a, b) => labelWeight(b) - labelWeight(a));
        }

        function labelWeight(label) {
            if (label === 'best') {
                return Number.MAX_SAFE_INTEGER;
            }

            const numeric = parseInt(label, 10);
            return Number.isFinite(numeric) ? numeric : 0;
        }

        function guessMimeType(ext) {
            if (!ext) {
                return 'application/x-mpegURL';
            }

            const normalized = ext.toLowerCase();
            switch (normalized) {
                case 'mp4':
                case 'm4v':
                    return 'video/mp4';
                case 'webm':
                    return 'video/webm';
                case 'mkv':
                    return 'video/x-matroska';
                case 'm3u8':
                case 'hls':
                    return 'application/x-mpegURL';
                default:
                    return `video/${normalized}`;
            }
        }

        function showStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.classList.toggle('error', isError);
        }

        function resetPlayer() {
            lastUrl = '';
            currentQuality = 'best';
            player.pause();
            playerSource.removeAttribute('src');
            playerSource.removeAttribute('type');
            player.poster = defaultPoster;
            player.load();
            qualitySelect.disabled = true;
            qualitySelect.innerHTML = '<option>Select a stream first</option>';
        }
    </script>
</body>
</html>
